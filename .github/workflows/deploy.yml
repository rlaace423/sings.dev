name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # CJK glyphs for rehype-mermaid text-width measurement. Without these,
      # Playwright Chromium's Korean fallback differs from macOS browsers'
      # system Korean font and the last char of node labels clips.
      - name: Install CJK fonts for mermaid build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

      # Both test layers gate the deploy (see docs/spec-testing.md).
      # `npm test` covers helpers, plugins, and page structure; the visual
      # suite drives the built site in Chromium: layout/contrast invariants on
      # every page, interaction flows, OG card pixels, and screenshot baselines.
      - name: Unit and structure tests
        run: npm test
      - name: Visual regression tests
        run: npm run test:visual
      - name: Upload visual test report and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

      # Screenshot baselines are per platform. When Linux has none yet (first
      # run after a new shot was added), the suite writes candidates instead of
      # failing; hand them back so they can be reviewed and committed.
      - name: Detect newly created Linux screenshot baselines
        id: baselines
        if: always()
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- tests/visual/__screenshots__)" ]; then
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Visual baselines created::Linux screenshot baselines were written in this run and the affected screenshot tests were skipped. Download the 'visual-baselines-linux' artifact, review it, commit it under tests/visual/__screenshots__/, and CI will compare screenshots from the next run on."
          fi
      - name: Upload newly created Linux screenshot baselines
        if: steps.baselines.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__
          retention-days: 30

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
